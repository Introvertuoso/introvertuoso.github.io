- title: Research Interests
  type: list
  contents:
    - '<strong>Explainable & Interpretable Machine Learning:</strong> Differentiable subgroup discovery, rule-based representation learning, and data mining methods.'
    - '<strong>BioMedical Data Science & Survival Analysis:</strong> Exceptional survival subgroup identification, time-to-event dynamics, and clinical decision support.'
    - '<strong>Computational Nanomedicine:</strong> Predictive pharmacokinetic modeling of nanoparticle translocation across the blood-brain barrier (BBB).'
    - '<strong>Clinical Informatics & Epidemiology:</strong> Longitudinal viral infection trends, IVF protocol optimization, and statistical modeling.'

